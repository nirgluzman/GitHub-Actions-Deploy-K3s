apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.webserver.name }}-deployment

spec:
  replicas: {{ .Values.webserver.replicaCount }}

  selector:
    matchLabels:
      server: {{ .Values.webserver.name }}

  template:
    metadata:
      labels:
        server: {{ .Values.webserver.name }}
      annotations:
        # trigger an update rollout by updating the object's `spec: template`
        # https://stackoverflow.com/questions/46336852/helm-upgrade-doesnt-pull-new-container
        # https://stackoverflow.com/questions/58561126/adding-time-stamp-to-kubernetes-deployment-with-latest-tag
        # https://cloud.google.com/kubernetes-engine/docs/how-to/updating-apps
        timestamp: "{{ now | unixEpoch }}"
    spec:
      containers:
        - name: {{ .Values.webserver.name }}
          image: {{ .Values.webserver.image.name }}:{{ .Values.webserver.image.tag }}
          imagePullPolicy: {{ .Values.webserver.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.webserver.image.exposedPort }}
          resources:
            limits:
              memory: '512Mi'
              cpu: '500m'
      restartPolicy: Always
      imagePullSecrets:
        - name: regcred
