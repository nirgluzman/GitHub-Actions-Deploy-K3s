# Default values for web-app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

webserver:
  name: webserver

  image:
    name: IMAGE_NAME
    tag: latest
    exposedPort: 80
    pullPolicy: Always # when the container is restarted, explicitly forces Kubernetes to pull the image from container registry.

  replicaCount: 1

  service:
    type: NodePort
    nodePort: 30001
