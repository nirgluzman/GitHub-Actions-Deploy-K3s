name: Create K3s dev cluster with Terraform

on:
  workflow_dispatch:
  # push:
  #   branches: ['main']

env:
  AWS_REGION: us-east-1

# Enable OpenID Connect for AWS
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    # Set the default shell and working-directory to all run steps in the job
    defaults:
      run:
        shell: bash
        working-directory: ./environments/dev

    steps:
      # Configure AWS credentials and region environment variables
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE}}
          aws-region: ${{ env.AWS_REGION }}

      # Checkout the repository to the GitHub Actions runner
      - name: Checkout source code
        uses: actions/checkout@v4

      # Install the latest version of Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
      - name: Terraform Init
        run: terraform init -backend-config=backend.conf

      # Build or apply changes to infrastructure according to Terraform configuration files
      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

      # Export workflow artifacts
      - name: Export SSH private key artifact
        uses: actions/upload-artifact@v4
        with:
          name: k3s-key.pem
          path: environments/dev/ansible/k3s-key.pem
