name: Create K3s dev cluster with Terraform

on:
  workflow_dispatch:
  push:
    branches: ['main']

# Enable OpenID Connect for AWS
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    # Use the Bash shell regardless whether the GitHub Actions runner
    defaults:
      run:
        shell: bash

    steps:
      # Configure AWS credentials and region environment variables
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE}}
          aws-region: ${{ env.AWS_REGION }}

      # Checkout the repository to the GitHub Actions runner
      - name: Checkout source code
        uses: actions/checkout@v4

      # Install the latest version of Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
      - name: Terraform Init
        run: cd environments/dev && terraform init -backend-config=backend.conf

      # Checks that all Terraform configuration files adhere to a canonical format
      - name: Terraform Format
        run: terraform fmt -check

      # Generates an execution plan for Terraform
      - name: Terraform Plan
        run: terraform plan -input=false

      # On push to "main", build or change infrastructure according to Terraform configuration files
      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

      # Export workflow artifacts
      - name: Export SSH private key artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-private-key
          path: environments/dev/ansible/k3s-key.pem
