name: Destroy K3s dev cluster created by Terraform, manually triggered

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

# Enable OpenID Connect for AWS
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    # Set the default shell and working-directory to all run steps in the job
    defaults:
      run:
        shell: bash
        working-directory: ./environments/dev

    steps:
      # Configure AWS credentials and region environment variables
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE}}
          aws-region: ${{ env.AWS_REGION }}

      # Checkout the repository to the GitHub Actions runner
      - name: Checkout source code
        uses: actions/checkout@v4

      # Install the latest version of Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
      - name: Terraform Init
        run: terraform init -backend-config=backend.conf

      # Checks that all Terraform configuration files adhere to a canonical format
      - name: Terraform Format
        run: terraform fmt -check

      # On push to "main", build or change infrastructure according to Terraform configuration files
      - name: Terraform Apply
        run: terraform destroy -auto-approve -input=false
